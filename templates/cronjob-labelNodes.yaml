apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: cronjob-label-storage-nodes
  namespace: {{ .Values.odf.namespace }}
spec:
  schedule: {{ .Values.job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.job.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.job.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # A drain-evicted (cancelled) pod is ignored rather than counted as a
      # failure; only genuine failures count toward backoffLimit.
      podFailurePolicy:
        rules:
          - action: Ignore
            onExitCodes:
              containerName: label-storage-nodes
              operator: In
              values: [143]
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
      template:
        spec:
          {{- include "odf.labelStorageNodes.podSpec" . | nindent 10 }}
