suite: Test wait-for-mcp Job
templates:
  - templates/job-waitForMcp.yaml
release:
  name: release-test
tests:
  - it: Should render the Job with default values
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: job-wait-for-mcp
      - equal:
          path: metadata.namespace
          value: openshift-storage
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "-1"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: odf-node-label-sa
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].image
          value: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest

  - it: Should wait on the worker pool with the default timeout
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: oc wait machineconfigpool/worker --for=condition=Updated --timeout=2700s
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: set -euo pipefail

  - it: Should support custom pools and timeout
    set:
      waitForMcp:
        pools:
          - worker
          - infra
        timeout: 600
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: oc wait machineconfigpool/worker --for=condition=Updated --timeout=600s
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: oc wait machineconfigpool/infra --for=condition=Updated --timeout=600s

  - it: Should not render the Job when disabled
    set:
      waitForMcp:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
